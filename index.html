<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxt@y | Gravures sur bois</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lumanosimo&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="containerPage">
        <div class="containerPhoto">
            <div class="photoOverlay"></div>
            <div class="imageCaption">
                <span class="captionLine"></span>
                <span>Créations en bois </span>
            </div>
        </div>
        <div class="containerText">
            <header class="homeHeader">
                <span class="homeEyebrow">Atelier de gravure</span>
                <span class="homeMark" aria-hidden="true">F</span>
            </header>
            <div class="containerPresentation">
                <div class="containerPhoto_logo">
                    <img src="./ressources/Foxt@y.png" alt="Portrait de Fabrice, créateur de Foxt@y" class="photoLogo">
                    <div>
                        <p class="welcomeLabel">Bienvenue chez</p>
                        <h1>Foxt@y</h1>
                    </div>
                </div>
                <p class="homeDescription">Des gravures sur bois personnalisées, imaginées et réalisées avec patience pour donner une histoire à chaque pièce.</p>
            </div>
            <div class="containerNav">
                <a class="primaryAction" href="./page1.html"><span>Découvrir les créations</span><span aria-hidden="true">&rarr;</span></a>
                <a class="secondaryAction" href="contact.html">Parler de votre projet</a>
            </div>
            <p class="homeFooter">Chaque pièce est unique, comme l'idée qui l'a fait naître.</p>
        </div>
